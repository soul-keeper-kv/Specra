# Started automatically by spring-boot-docker-compose when you run the API,
# and by `docker compose up -d` from the repo root.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: specra-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-specra}
      POSTGRES_USER: ${DB_USER:-specra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-specra}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - specra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-specra} -d ${DB_NAME:-specra}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  specra-pgdata:
