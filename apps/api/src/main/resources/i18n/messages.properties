# Default bundle: English. Loaded when Accept-Language names a language we have no bundle for.
#
# Keys are grouped by what produces them:
#   resource.*        nouns substituted into error sentences (see LocalizedText)
#   error.<code>.*    one title + detail per ErrorCode constant
#   validation.*      Bean Validation messages referenced as {key} on DTO annotations
#   jakarta.*         overrides for constraints used without an explicit message
#   problemDetail.*   Spring MVC's own failures, resolved by ResponseEntityExceptionHandler
#
# Every key here must exist in messages_vi.properties too; MessageBundleTest enforces that.

# ── resources ────────────────────────────────────────────────────────────────
resource.note=Note
resource.conversation=Conversation

# ── errors ───────────────────────────────────────────────────────────────────
error.validation-failed.title=Validation failed
error.validation-failed.detail=One or more fields are invalid. See fieldErrors.

error.malformed-request.title=Malformed request
error.malformed-request.detail=The request body could not be parsed as JSON.

error.missing-parameter.title=Missing parameter
error.missing-parameter.detail=A required parameter was not supplied.

error.invalid-parameter.title=Invalid parameter
error.invalid-parameter.detail=A parameter has the wrong type or an unacceptable value.

error.unauthorized.title=Not signed in
error.unauthorized.detail=This endpoint requires authentication.

error.forbidden.title=Not allowed
error.forbidden.detail=You do not have access to this resource.

error.resource-not-found.title=Not found
error.resource-not-found.detail={0} {1} does not exist.

error.endpoint-not-found.title=No such endpoint
error.endpoint-not-found.detail=This path is not part of the API.

error.method-not-allowed.title=Method not allowed
error.method-not-allowed.detail=This endpoint does not accept that HTTP method.

error.conflict.title=Conflict
error.conflict.detail=The resource changed since you read it, or the write broke a constraint. Reload and try again.

error.unsupported-media-type.title=Unsupported media type
error.unsupported-media-type.detail=Send the body as application/json.

error.payload-too-large.title=Payload too large
error.payload-too-large.detail=The request body exceeds the accepted size.

error.rate-limited.title=Too many requests
error.rate-limited.detail=Slow down and retry in a moment.

error.ai-provider-error.title=Model provider error
error.ai-provider-error.detail=The model provider rejected the request. Check the API key, the quota and the configured model name.

error.ai-provider-unavailable.title=Model provider unavailable
error.ai-provider-unavailable.detail=The model provider could not be reached. This is usually temporary.

error.ai-not-configured.title=Assistant not configured
error.ai-not-configured.detail=No API key is configured for the "{0}" model provider, so the assistant cannot answer yet. Add a key to enable it.

error.unsupported-operation.title=Not supported here
error.unsupported-operation.detail=This content store does not support that operation.

error.content.unknown-kind=There is no content store named {0}. Available kinds: {1}.

error.internal-error.title=Unexpected error
error.internal-error.detail=Something went wrong on our side. Quote the traceId when reporting it.

