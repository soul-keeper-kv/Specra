# ── errors ───────────────────────────────────────────────────────────────────
error.validation-failed.title=Dữ liệu không hợp lệ
error.validation-failed.detail=Một hoặc nhiều trường không hợp lệ. Xem chi tiết ở fieldErrors.

error.malformed-request.title=Yêu cầu sai định dạng
error.malformed-request.detail=Không đọc được nội dung yêu cầu dưới dạng JSON.

error.missing-parameter.title=Thiếu tham số
error.missing-parameter.detail=Thiếu một tham số bắt buộc.

error.invalid-parameter.title=Tham số không hợp lệ
error.invalid-parameter.detail=Một tham số sai kiểu dữ liệu hoặc có giá trị không chấp nhận được.

error.unauthorized.title=Chưa đăng nhập
error.unauthorized.detail=Endpoint này yêu cầu xác thực.

error.forbidden.title=Không có quyền
error.forbidden.detail=Bạn không có quyền truy cập tài nguyên này.

error.invalid-credentials.title=Đăng nhập không thành công
error.invalid-credentials.detail=Email hoặc mật khẩu không đúng.

error.invalid-token.title=Phiên đã hết hạn
error.invalid-token.detail=Token của phiên bị thiếu, đã hết hạn hoặc đã bị thu hồi. Hãy đăng nhập lại.

error.account-locked.title=Tài khoản tạm khóa
error.account-locked.detail=Đăng nhập sai quá nhiều lần. Hãy chờ một lát rồi thử lại.

error.account-suspended.title=Tài khoản bị đình chỉ
error.account-suspended.detail=Quản trị viên đã đình chỉ tài khoản này. Hãy liên hệ chủ không gian làm việc của bạn.

error.email-already-used.title=Email đã được sử dụng
error.email-already-used.detail=Đã có tài khoản dùng email này. Hãy đăng nhập thay vì đăng ký.

error.resource-not-found.title=Không tìm thấy
error.resource-not-found.detail=Không tồn tại {0} {1}.

error.endpoint-not-found.title=Endpoint không tồn tại
error.endpoint-not-found.detail=Đường dẫn này không thuộc API.

error.method-not-allowed.title=Phương thức không được phép
error.method-not-allowed.detail=Endpoint này không chấp nhận phương thức HTTP đó.

error.conflict.title=Xung đột dữ liệu
error.conflict.detail=Tài nguyên đã thay đổi kể từ lúc bạn đọc, hoặc thao tác ghi vi phạm ràng buộc. Hãy tải lại và thử lại.

error.unsupported-media-type.title=Kiểu nội dung không được hỗ trợ
error.unsupported-media-type.detail=Hãy gửi nội dung dưới dạng application/json.

error.payload-too-large.title=Nội dung quá lớn
error.payload-too-large.detail=Nội dung yêu cầu vượt quá kích thước cho phép.

error.rate-limited.title=Quá nhiều yêu cầu
error.rate-limited.detail=Hãy giảm tần suất và thử lại sau giây lát.

error.ai-provider-error.title=Lỗi từ nhà cung cấp mô hình
error.ai-provider-error.detail=Nhà cung cấp mô hình đã từ chối yêu cầu. Hãy kiểm tra API key, hạn mức và tên mô hình đang cấu hình.

error.ai-provider-unavailable.title=Không kết nối được nhà cung cấp mô hình
error.ai-provider-unavailable.detail=Không liên lạc được với nhà cung cấp mô hình. Tình trạng này thường chỉ tạm thời.

error.ai-not-configured.title=Trợ lý chưa được cấu hình
error.ai-not-configured.detail=Chưa có API key cho nhà cung cấp mô hình "{0}", nên trợ lý chưa thể trả lời. Hãy thêm key để bật tính năng này.

error.unsupported-operation.title=Thao tác không được hỗ trợ
error.unsupported-operation.detail=Kho nội dung này không hỗ trợ thao tác đó.

error.content.unknown-kind=Không có kho nội dung nào tên {0}. Các loại hiện có: {1}.

error.workspace.duplicate-slug=Slug "{0}" đã thuộc về một không gian làm việc khác.
error.project.duplicate-key=Mã "{0}" đã được một dự án khác trong không gian làm việc này sử dụng.
error.ai-account.encryption-unavailable=Máy chủ này chưa thể lưu API key: hãy đặt SPECRA_ENCRYPTION_KEY rồi khởi động lại, sau đó lưu key lần nữa.

error.internal-error.title=Lỗi ngoài dự kiến
error.internal-error.detail=Đã có lỗi xảy ra ở phía chúng tôi. Hãy gửi kèm traceId khi báo lỗi.

