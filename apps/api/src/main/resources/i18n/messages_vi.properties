error.working-copy-dirty.detail=Bản làm việc đang có thay đổi chưa commit. Hãy commit hoặc bỏ chúng rồi thử lại.

error.repository-not-connected.title=Chưa kết nối kho mã
error.repository-not-connected.detail=Hãy kết nối dự án này với một kho Git trước, rồi thử lại.

