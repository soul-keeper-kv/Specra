error.ai-provider-error.title=Lỗi từ nhà cung cấp mô hình
error.ai-provider-error.detail=Nhà cung cấp mô hình đã từ chối yêu cầu. Hãy kiểm tra API key, hạn mức và tên mô hình đang cấu hình.

error.ai-provider-unavailable.title=Không kết nối được nhà cung cấp mô hình
error.ai-provider-unavailable.detail=Không liên lạc được với nhà cung cấp mô hình. Tình trạng này thường chỉ tạm thời.

error.ai-not-configured.title=Trợ lý chưa được cấu hình
error.ai-not-configured.detail=Chưa có API key cho nhà cung cấp mô hình "{0}", nên trợ lý chưa thể trả lời. Hãy thêm key để bật tính năng này.

error.unsupported-operation.title=Thao tác không được hỗ trợ
error.unsupported-operation.detail=Kho nội dung này không hỗ trợ thao tác đó.

error.content.unknown-kind=Không có kho nội dung nào tên {0}. Các loại hiện có: {1}.

error.internal-error.title=Lỗi ngoài dự kiến
error.internal-error.detail=Đã có lỗi xảy ra ở phía chúng tôi. Hãy gửi kèm traceId khi báo lỗi.

