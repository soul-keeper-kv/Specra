error.resource-not-found.title=Không tìm thấy
error.resource-not-found.detail=Không tồn tại {0} {1}.

error.endpoint-not-found.title=Endpoint không tồn tại
error.endpoint-not-found.detail=Đường dẫn này không thuộc API.

error.method-not-allowed.title=Phương thức không được phép
error.method-not-allowed.detail=Endpoint này không chấp nhận phương thức HTTP đó.

error.conflict.title=Xung đột dữ liệu
error.conflict.detail=Tài nguyên đã thay đổi kể từ lúc bạn đọc, hoặc thao tác ghi vi phạm ràng buộc. Hãy tải lại và thử lại.

error.unsupported-media-type.title=Kiểu nội dung không được hỗ trợ
error.unsupported-media-type.detail=Hãy gửi nội dung dưới dạng application/json.

error.payload-too-large.title=Nội dung quá lớn
error.payload-too-large.detail=Nội dung yêu cầu vượt quá kích thước cho phép.

error.rate-limited.title=Quá nhiều yêu cầu
