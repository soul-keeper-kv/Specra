spring:
  application:
    name: specra-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:specra}
    username: ${DB_USER:specra}
    password: ${DB_PASSWORD:specra}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mapping still matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # The repo's .env, if there is one. Without this, `pnpm dev:api` sees none of it and a key
  # put there silently does nothing — only the VS Code launch configurations picked it up,
  # through their own envFile. `optional:` means a checkout without the file still boots, and
  # real environment variables still win, so nothing changes for CI or production.
  config:
    import: optional:file:../../.env[.properties]

  # Running the API brings the database up if it is not already running. It points at
  # the repo's one compose file rather than a copy beside this module: two files both
  # declaring container_name specra-postgres are two compose projects fighting over one
  # container name, and the loser is whichever process started second — the API, dying
  # at startup with "container name is already in use". The path is relative to the
  # working directory, which is apps/api for `pnpm dev:api` and for both API launch
  # configurations in .vscode/launch.json.
  #
  # start_only: the database outlives the process that started it, so restarting the API
  # does not take the data with it. Tests set enabled:false — Testcontainers owns their
  # database (see application-test.yml).
  docker:
    compose:
      enabled: true
      file: ../../docker-compose.yml
      lifecycle-management: start_only

  # ─────────────────────────────────────────────────────────────────────────
  # Translations. messages.properties is the English fallback, messages_vi.properties
  # the Vietnamese one; adding a language means adding a bundle beside them and a
  # constant in SupportedLocale. fallback-to-system-locale must stay false, or a
  # server whose OS locale is Vietnamese would answer an English request in
  # Vietnamese whenever a key is missing from the default bundle.
  # ─────────────────────────────────────────────────────────────────────────
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
    cache-duration: 1h

  mvc:
    # Unknown paths raise NoResourceFoundException, which reaches GlobalExceptionHandler
    # and comes back as problem+json — not as the container's HTML error page.
    problemdetails:
      enabled: false

  ai:
    # ─────────────────────────────────────────────────────────────────────────
    # The only two lines that decide which vendor runs. Every starter is on the
    # classpath; Spring AI instantiates just the selected one, so switching is
    # `AI_CHAT_PROVIDER=openai` and a restart — no code edit, no rebuild.
    #   chat:      anthropic | openai | ollama
    #   embedding: transformers | openai | ollama   (anthropic has no embeddings)
    # ─────────────────────────────────────────────────────────────────────────
    model:
      chat: ${AI_CHAT_PROVIDER:anthropic}
      embedding: ${AI_EMBEDDING_PROVIDER:transformers}
      # Specra only uses chat and embeddings. The image/audio/moderation
      # auto-configurations are not gated by the two switches above, so they
      # would still build an OpenAI bean and abort startup with "OpenAI API
      # key must be set" whenever OPENAI_API_KEY is present but empty --
      # which is exactly what .env.example ships and what launch.json feeds in
      # through envFile. A `${VAR:default}` default only applies when VAR is
      # absent, never when it is set to an empty string.
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
          temperature: 0.7
          # Bumped from 2048 now that the assistant has tools: an answer that quotes retrieved
          # test case bodies runs long, and a truncated answer looks like a model failure
          # rather than a limit. Thinking, if it were ever enabled, must stay below this number.
          max-tokens: ${ANTHROPIC_MAX_TOKENS:8192}

    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: ${OLLAMA_PULL:never}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        # Left to create its own table so the vector width always follows the
        # active embedding model (transformers 384, ollama 768, openai 1536).
        # Change AI_EMBEDDING_PROVIDER => drop the vector_store table first.
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 1000

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

server:
  port: ${SERVER_PORT:8080}
  error:
    # The whitelabel page is unreachable anyway: every error is rendered by
    # GlobalExceptionHandler as an RFC 9457 problem document.
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when-authorized
  health:
    # A missing API key should not make the whole app look unhealthy.
    defaults:
      enabled: true
  tracing:
    sampling:
      # Every request is traced in development. Turn this down in production, where
      # the point of sampling is cost rather than completeness.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  observations:
    key-values:
      application: specra-api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    displayRequestDuration: true
  api-docs:
    path: /v3/api-docs

specra:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  content:
    # Which ContentStore the assistant's tools act on when a call does not name one.
    # Must match a ContentStore bean's kind(); ContentStoreRegistry checks that at
    # startup, so a typo fails the boot instead of the first tool call.
    default-kind: ${CONTENT_DEFAULT_KIND:testcase}
  security:
    # AES key (base64 → 16/24/32 bytes) that SecretsCipher encrypts stored secrets with —
    # a workspace's own provider API key today, environment secrets later. Optional in
    # development: left unset, everything runs and only *storing* a secret is refused with
    # an error naming this variable. Generate one:  openssl rand -base64 32
    encryption-key: ${SPECRA_ENCRYPTION_KEY:}
    # Anyone who knows this string can mint an access token for any account, so the
    # default below is a development convenience and nothing else — SecurityConfig
    # logs a warning while it is in use, and the prod profile at the foot of this file
    # drops the default so a deployment that forgets the variable fails to start
    # rather than coming up insecure. Generate one:  openssl rand -base64 48
    jwt:
      secret: ${SPECRA_JWT_SECRET:dev-only-secret-not-for-anything-that-matters}
      issuer: ${SPECRA_JWT_ISSUER:specra}
      # An access token is verified by signature alone and never looked up, so revoking
      # a session takes effect at the next refresh: this number is that delay.
      access-minutes: ${SPECRA_JWT_ACCESS_MINUTES:15}
      refresh-days: ${SPECRA_JWT_REFRESH_DAYS:30}
    # Password guessing, throttled per account. The lock expires on its own; a permanent
    # one would turn an attack on a user into a support ticket from that user.
    lockout:
      max-attempts: ${SPECRA_LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${SPECRA_LOCKOUT_DURATION:PT15M}
    # Set false once the installation has its people: sign-up closes, and accounts are
    # created by inviting an address into a workspace instead.
    registration-open: ${SPECRA_REGISTRATION_OPEN:true}
  runner:
    # The Node service that owns the Playwright toolchain (03-module-boundaries.md). Codegen is
    # a pure function over the job payload, so this is a plain HTTP call with no queue behind
    # it yet; `pnpm --filter specra-runner start` is what listens here in development.
    base-url: ${RUNNER_BASE_URL:http://127.0.0.1:8090}
    timeout: ${RUNNER_TIMEOUT:PT30S}
    # What a *run* gets instead: a suite is minutes, so the ceiling above would kill every one.
    run-timeout: ${SPECRA_RUN_TIMEOUT:PT20M}
    # Queued or running, per workspace. A tenant that queues fifty runs slows only itself.
    max-concurrent-per-workspace: ${SPECRA_RUN_CONCURRENCY:3}

  ai:
    system-prompt: >
      You are Specra's assistant. Answer concisely and concretely.
      When you are unsure, say so instead of inventing details.
      Reply in the same language the user wrote in.
      You can search the user's saved documents with the search_content tool and read one
      in full with get_content. Use them before answering anything about what the user has
      written, and cite the titles you relied on. Never claim a document exists without
      having found it with a tool.
    chat-memory:
      max-messages: 40
    rag:
      chunk-size: 800
    # ─────────────────────────────────────────────────────────────────────────
    # A one-token generation against the active chat provider, on a timer, so the
    # product can answer "is the assistant working" before a user's question is the
    # thing that discovers it is not. GET /api/ai/health serves the last result from
    # memory and never calls a provider on the request thread.
    #
    # The durations are ISO-8601 because @Scheduled reads `interval` straight from the
    # environment and parses only that form — `5m` binds here and then fails at startup.
    #
    # A metered provider bills every probe, so the interval is the cost dial: PT5M is
    # ~288 one-token calls a day. Set AI_HEALTH_ENABLED=false to stop probing entirely;
    # ?refresh=true keeps working, so a "test connection" button still does.
    # ─────────────────────────────────────────────────────────────────────────
    health:
      enabled: ${AI_HEALTH_ENABLED:true}
      interval: ${AI_HEALTH_INTERVAL:PT5M}
      # Long enough that the probe does not compete with the rest of startup.
      initial-delay: PT10S
      # A provider that has not answered by now is not up, whatever it does later.
      timeout: ${AI_HEALTH_TIMEOUT:PT10S}
      # Floor between two forced (?refresh=true) probes — the endpoint has no auth yet.
      min-refresh-interval: PT10S
  logging:
    access:
      enabled: true
      # Above this, the access log line is a WARN rather than an INFO.
      slow-request-millis: 1000
  git:
    # Working copies, one directory per (project, branch). A cache by contract: safe to
    # delete at any time, re-cloned on demand, never pointed into by the database. The
    # relative default lands under apps/api/data/, which is gitignored.
    repos-dir: ${SPECRA_GIT_REPOS_DIR:data/repos}
    # The committer on every commit Specra publishes. The *author* is the signed-in user —
    # attribution belongs to whoever approved the change — and this is the tool that wrote
    # it out, the same split rebase and cherry-pick record.
    committer-name: ${SPECRA_GIT_COMMITTER_NAME:Specra}
    committer-email: ${SPECRA_GIT_COMMITTER_EMAIL:bot@specra.dev}

logging:
  level:
    dev.specra: DEBUG
    org.springframework.ai.chat.client.advisor: INFO
  pattern:
    # Boot already prints [app,traceId,spanId] once Micrometer Tracing is on the
    # classpath. requestId is ours, so it has to be appended here. Overriding this
    # one property keeps every other Boot logging default intact -- which is what
    # lets the prod profile below swap the whole console over to structured JSON
    # without a logback-spring.xml to maintain.
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        format_sql: false

specra:
  security:
    jwt:
      # No default: an unresolvable placeholder stops the boot, which is the intended
      # behaviour. A production instance signing tokens with the development secret is
      # not authenticated at all, and it would look identical from the outside.
      secret: ${SPECRA_JWT_SECRET}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

logging:
  level:
    dev.specra: INFO
  structured:
    # Boot renders the console as ECS JSON, MDC fields included — so requestId,
    # traceId and spanId arrive in Elasticsearch or Loki as queryable fields
    # rather than as text inside a message. No extra dependency, no encoder.
    format:
      console: ecs
