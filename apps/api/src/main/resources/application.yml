spring:
  application:
    name: specra-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:specra}
    username: ${DB_USER:specra}
    password: ${DB_PASSWORD:specra}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mapping still matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  docker:
    compose:
      enabled: true
      lifecycle-management: start_only

  # ─────────────────────────────────────────────────────────────────────────
  # Translations. messages.properties is the English fallback, messages_vi.properties
  # the Vietnamese one; adding a language means adding a bundle beside them and a
  # constant in SupportedLocale. fallback-to-system-locale must stay false, or a
  # server whose OS locale is Vietnamese would answer an English request in
  # Vietnamese whenever a key is missing from the default bundle.
  # ─────────────────────────────────────────────────────────────────────────
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
    cache-duration: 1h

  mvc:
    # Unknown paths raise NoResourceFoundException, which reaches GlobalExceptionHandler
    # and comes back as problem+json — not as the container's HTML error page.
    problemdetails:
      enabled: false

  ai:
    # ─────────────────────────────────────────────────────────────────────────
    # The only two lines that decide which vendor runs. Every starter is on the
    # classpath; Spring AI instantiates just the selected one, so switching is
    # `AI_CHAT_PROVIDER=openai` and a restart — no code edit, no rebuild.
    #   chat:      anthropic | openai | ollama
    #   embedding: transformers | openai | ollama   (anthropic has no embeddings)
    # ─────────────────────────────────────────────────────────────────────────
    model:
      chat: ${AI_CHAT_PROVIDER:anthropic}
      embedding: ${AI_EMBEDDING_PROVIDER:transformers}
      # Specra only uses chat and embeddings. The image/audio/moderation
      # auto-configurations are not gated by the two switches above, so they
      # would still build an OpenAI bean and abort startup with "OpenAI API
      # key must be set" whenever OPENAI_API_KEY is present but empty --
      # which is exactly what .env.example ships and what launch.json feeds in
      # through envFile. A `${VAR:default}` default only applies when VAR is
      # absent, never when it is set to an empty string.
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
          temperature: 0.7
          max-tokens: 2048

    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: ${OLLAMA_PULL:never}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        # Left to create its own table so the vector width always follows the
        # active embedding model (transformers 384, ollama 768, openai 1536).
        # Change AI_EMBEDDING_PROVIDER => drop the vector_store table first.
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 1000

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

server:
  port: ${SERVER_PORT:8080}
  error:
    # The whitelabel page is unreachable anyway: every error is rendered by
    # GlobalExceptionHandler as an RFC 9457 problem document.
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when-authorized
  health:
    # A missing API key should not make the whole app look unhealthy.
    defaults:
      enabled: true
  tracing:
    sampling:
      # Every request is traced in development. Turn this down in production, where
      # the point of sampling is cost rather than completeness.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  observations:
    key-values:
      application: specra-api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    displayRequestDuration: true
  api-docs:
    path: /v3/api-docs

specra:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    system-prompt: >
      You are Specra's assistant. Answer concisely and concretely.
      When you are unsure, say so instead of inventing details.
      Reply in the same language the user wrote in.
    chat-memory:
      max-messages: 40
    rag:
      chunk-size: 800
  logging:
    access:
      enabled: true
      # Above this, the access log line is a WARN rather than an INFO.
      slow-request-millis: 1000

logging:
  level:
    dev.specra: DEBUG
    org.springframework.ai.chat.client.advisor: INFO
  pattern:
    # Boot already prints [app,traceId,spanId] once Micrometer Tracing is on the
    # classpath. requestId is ours, so it has to be appended here. Overriding this
    # one property keeps every other Boot logging default intact -- which is what
    # lets the prod profile below swap the whole console over to structured JSON
    # without a logback-spring.xml to maintain.
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        format_sql: false

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

logging:
  level:
    dev.specra: INFO
  structured:
    # Boot renders the console as ECS JSON, MDC fields included — so requestId,
    # traceId and spanId arrive in Elasticsearch or Loki as queryable fields
    # rather than as text inside a message. No extra dependency, no encoder.
    format:
      console: ecs
