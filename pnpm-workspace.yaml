# One install for the whole repo: `pnpm install` at the root covers every package below.
packages:
  - apps/web
  # The Test Model / IR contract: schema, types and fixtures. It depends on no app and no
  # execution engine, which is what lets the web app, the runner and apps/api share it.
  - packages/test-model
  # End-to-end tests are their own package, not part of the app they drive: the suite has to
  # be runnable against a deployed URL, and nothing in apps/web should be able to import it.
  - tests/e2e

# pnpm does not run a dependency's install scripts unless it is allowed here.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  unrs-resolver: true

# lucide-react 1.38.0 is newer than pnpm's default minimum release age gate.
minimumReleaseAgeExclude:
  - lucide-react@1.38.0
