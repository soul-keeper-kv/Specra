# Postgres with the vector extension, shared by the API and by `mvnw verify`.
#
# This is the only compose file in the repo, and that is deliberate. `pnpm db:up`
# and spring-boot-docker-compose (see spring.docker.compose.file in the API's
# application.yml) both bring up *this* file, so starting the database twice is a
# no-op instead of a conflict.
#
# `name` is pinned rather than inferred from the checkout directory: compose
# derives the project name from the folder, so a clone into `specra-main` would
# otherwise be a second project trying to create the same `container_name`, and
# Docker refuses that with "container name is already in use".
name: specra

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: specra-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-specra}
      POSTGRES_USER: ${DB_USER:-specra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-specra}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - specra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-specra} -d ${DB_NAME:-specra}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  specra-pgdata:
